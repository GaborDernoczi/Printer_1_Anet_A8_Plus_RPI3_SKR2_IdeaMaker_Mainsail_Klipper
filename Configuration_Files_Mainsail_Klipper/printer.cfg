# This file contains common pin mappings for the BigTreeTech SKR 2.
# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader".

# In newer versions of this board shipped in late 2021 the STM32F429
# is used, if this is the case compile for this with a "32KiB bootloader"
# You will need to check the chip on your board to identify which you have.
#
# The "make flash" command does not work on the SKR 2. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR 2
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Note: The initial revision of this board has a flaw that can cause
# damage to itself and other boards. Be sure to verify the board is
# not impacted by this flaw before using it.

##################################################################   PRINTER_1   Raspberry 3b+ & SKR2   ##############################################################

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_2D0027000C47393437303337-if00

[stepper_x]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PD5
dir_pin: !PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC3
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^!PC0
#position_endstop: 0.5
position_max: 300

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 35.845
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
#control: pid
#pid_Kp: 39.518
#pid_Ki: 3.421
#pid_Kd: 114.109
min_temp: 10
max_temp: 250
# Kell a 100 mm-es extruder kalibraciohoz (alapertek csak 50 mm)
max_extrude_only_distance: 150
# Sarok-megfolyas ellen. Direct drive kiindulas ~0.03-0.08, Bowden ~0.4-0.8.
# Kalibralas utan (SET_PRESSURE_ADVANCE teszt) ird at!
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

#[extruder1]
#step_pin: PD11
#dir_pin: PD10
#enable_pin: !PD13
#heater_pin: PB4
#sensor_pin: PA3
#...

[heater_bed]
heater_pin: PB3
sensor_type: Generic 3950
sensor_pin: PA1
#control: watermark
min_temp: 10
max_temp: 130

#[verify_heater heater_bed]
#max_error: 120
#check_gain_time: 90
#hysteresis: 10
#heating_gain: 1

[fan]
pin: PB7

[heater_fan fan1]
pin: PB6

[heater_fan fan2]
pin: PB5

# Due to BTT implementing a Marlin-specific safety feature,
# "anti-reversal stepper protection", this pin needs pulling
# high to pass power to stepper drivers and most FETs

[output_pin motor_power]
pin: PC13
value: 1

[printer]
kinematics: cartesian
max_velocity: 300
# Anet A8 Plus akrilvazhoz a 3000 sok -> ringing es sarok-hiba
max_accel: 1500
square_corner_velocity: 5.0
max_z_velocity: 5
max_z_accel: 100

[bltouch]
sensor_pin: ^PE4  
control_pin: PE5
pin_move_time: 0.7
x_offset: -30
y_offset: -25
#z_offset: 1.036

samples: 2
samples_result: average
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 150,150   # bed közepe (300x300-nál ez tökéletes)
speed: 20
z_hop: 10
z_hop_speed: 5

[bed_mesh]
mesh_min: 25, 25
mesh_max: 255, 255
probe_count: 5,5
algorithm: bicubic
speed: 80
horizontal_move_z: 5
fade_start: 1
fade_end: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE10, EXP1_7=PE12, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE9, EXP1_6=PE11, EXP1_8=PE13, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PE0
run_current: 0.800
#diag_pin:

[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.800
#diag_pin:

[tmc2209 stepper_z]
uart_pin: PD0
run_current: 0.800
#diag_pin:

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.600
#diag_pin:

#[tmc2209 extruder1]
#uart_pin: PD12
#run_current: 0.600
#diag_pin:

